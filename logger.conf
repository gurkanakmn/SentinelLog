# ==============================================================================
# LOGGER CONFIGURATION FILE
# ==============================================================================
# This file controls the runtime behavior of the framework.

# [GLOBAL SETTINGS]
HOT_RELOAD_ENABLED=false # If enabled, the logger will watch this file for changes and update settings in real-time.
HOT_RELOAD_INTERVAL_SEC=5 

LOG_LEVEL=INFO # Sets the global logging threshold. Options: DEBUG, INFO, WARNING, ERROR, FATAL
LOG_METADATA_ENABLED=true # Enables extra contextual metadata for each log entry


# [CONSOLE HANDLER]
# Enables/Disables log output to the terminal.
CONSOLE_HANDLER_ENABLED=true
COLOR_ENABLED=true

# [STANDARD FILE LOGGING]
# Records all log streams to a continuous log file.
# Note: Relative paths are supported. Use '../' to move to the parent directory.
FILE_HANDLER_ENABLED=true
FILE_PATH=../logs/log.log

# Log Format (Options: TEXT, JSON, CSV)
FILE_FORMAT=TEXT # Select the format according to the file extension (recommended)

# [LOG ROTATION SETTINGS]
# Set FILE_ROTATION_ENABLED=false for unlimited file size and 0 backups.
FILE_ROTATION_ENABLED=true
FILE_MAX_SIZE=5242880   # 1MB = 1048576, 5MB = 5242880, 10MB = 10485760, 100MB = 104857600 (in bytes)
FILE_MAX_BACKUPS=5        # Number of archived log files to keep (e.g., app.log.1, app.log.2)

# Performance: Forces disk write (flush) after every N log entries.
FILE_FLUSH_THRESHOLD=100

# [INCIDENT DIAGNOSTICS - BLACK BOX]
# A "Black Box" mode triggered only on specific error levels.
# Dumps the last N log entries from memory to a separate file upon failure.
MEMORY_HANDLER_ENABLED=false
MEMORY_CAPACITY=500       # Number of log lines to keep in circular buffer
MEMORY_TRIGGER_LEVEL=ERROR # Level that triggers the memory dump
MEMORY_DUMP_PATH=../logs/incident_report.json # JSON is recommended for diagnostic reports
MEMORY_FORMAT=JSON        # Select the format according to the file extension (recommended)


# ==============================================================================
# NOTES:
# - Lines starting with # are comments and are ignored.
# - Parser is whitespace-insensitive (KEY = VALUE or KEY=VALUE are both valid).
# - Built-in defaults will be used for any undefined keys.
# ==============================================================================